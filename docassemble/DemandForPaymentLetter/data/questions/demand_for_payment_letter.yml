template: amount_owed_conciliation_court_limits
subject: What to know about Conciliation Court limits
content: |
  Conciliation Court is sometimes called “People’s Court” or “Small Claims Court.” It is for simple court cases for disputes of up to $20,000. 
  
  If you want to sue [opposing party name] in conciliation court, you can still demand any amount of money in this letter. You can sue them for less money than what you demand in this letter.

  See our <a href="https://www.lawhelpmn.org/self-help-library/fact-sheet/conciliation-court" title="https://www.lawhelpmn.org/self-help-library/fact-sheet/conciliation-court">Conciliation Court fact sheet</a> for more information. 
