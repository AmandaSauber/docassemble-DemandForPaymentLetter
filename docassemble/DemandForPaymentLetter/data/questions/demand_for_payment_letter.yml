  View the original version of this form at the links below:

  % for url in [url for url in ORIGINAL_FORMS if url.strip() != "None" and url.startswith("http")]:
  * [${ url }](${ url })
  % endfor
  % elif len(ORIGINAL_FORMS) == 1:
  [View the original version of this form](${ ORIGINAL_FORMS[0] }).
  % endif

  To learn more about this legal topic, go to: [Conciliation Court and Collecting Money](https://www.lawhelpmn.org/self-help-library/money-debt-taxes/conciliation-court-and-collecting-money).
  
  [LawHelpMN](https://www.lawhelpmn.org/about-us) made this free tool. The goal of the LawHelpMN website is to provide accurate and easy-to-understand legal information. LawHelpMN is maintained by [Legal Services State Support](https://www.mnlegalservices.org/), which is non-profit that works to improve understanding and access to the civil legal justice system for all Minnesotans.

